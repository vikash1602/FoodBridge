  #     - key: DEBUG
  #       value: "False"
  #     - key: SECRET_KEY
  #       sync: false
  #     - key: DATABASE_URL
  #       sync: false
  #     - key: RESEND_API_KEY
  #       sync: false
  #     - key: OTP_EMAIL_FROM
  #       value: FoodBridge <onboarding@resend.dev>
  #     - key: OTP_EMAIL_FALLBACK_TO_CONSOLE
  #       value: "true"
